<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Die Deutscshe Hause - Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Arial:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('fondo.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      color: white;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
    }
    .card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body class="p-6">
  <nav class="navbar fixed top-0 left-0 w-full p-4 flex justify-between items-center z-10">
    <div class="flex items-center">
      <img src="logo.png" alt="Logo de Die Deutscshe Hause" class="h-12 rounded-full" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
      <h1 class="text-2xl font-bold ml-4">Die Deutscshe Hause</h1>
    </div>
    <div>
      <img src="logo2.png" alt="Logo pequeño" class="h-16" onerror="this.src='https://via.placeholder.com/40?text=Logo2'">
    </div>
  </nav>
  <div class="container mx-auto max-w-4xl mt-24">
    <h1 class="text-4xl font-bold text-center mb-8">Iniciar Sesión</h1>
    <div class="card p-6 rounded-3xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="username" class="block text-sm font-medium">Usuario</label>
          <input id="username" type="text" class="w-full p-3 mt-1 bg-gray-700 rounded-2xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ingresa el usuario">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium">Contraseña</label>
          <input id="password" type="password" class="w-full p-3 mt-1 bg-gray-700 rounded-2xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ingresa la contraseña">
        </div>
      </div>
      <div class="flex gap-4 mt-4">
        <button onclick="login()" class="flex-1 bg-blue-400 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-2xl">Iniciar Sesión</button>
        <button onclick="clearForm()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-2xl">Limpiar</button>
      </div>
      <div id="confirmationMessage" class="mt-4 text-center text-green-400 hidden"></div>
    </div>
  </div>
  <script>
    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmationMessage = document.getElementById('confirmationMessage');

      // Simulated org credentials (for main login)
      if (username === 'org' && password === 'org123') {
        localStorage.setItem('isLoggedIn', 'true');
        confirmationMessage.textContent = 'Sesión iniciada con éxito!';
        confirmationMessage.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      }
      // Simulated admin credentials (for admin-specific access)
      else if (username === 'admin' && password === 'admin123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('isAdminLoggedIn', 'true');
        confirmationMessage.textContent = 'Sesión de administrador iniciada con éxito!';
        confirmationMessage.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } else {
        confirmationMessage.textContent = 'Credenciales incorrectas. Intenta de nuevo.';
        confirmationMessage.classList.remove('hidden');
        confirmationMessage.classList.remove('text-green-400');
        confirmationMessage.classList.add('text-red-400');
      }
    }

    function clearForm() {
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('confirmationMessage').classList.add('hidden');
    }

    window.onload = function() {
      console.log('Loaded login.html');
      console.log('isLoggedIn:', localStorage.getItem('isLoggedIn'));
      console.log('isAdminLoggedIn:', localStorage.getItem('isAdminLoggedIn'));
    };
  </script>
</body>
</html>
