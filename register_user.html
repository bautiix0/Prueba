<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Die Deutscshe Hause - Registrar Jugador 👤</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Arial:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('fondo.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      color: white;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }
    .animate-bounce-in {
      animation: bounce-in 1s ease;
    }
    @keyframes bounce-in {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .hover-scale {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-scale:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
    }
    .glow {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
    .navbar {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
    }
    .card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .focus-glow {
      transition: box-shadow 0.3s ease;
    }
    .focus-glow:focus {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
    }
    .confirmation-message {
      animation: fade-in 0.5s ease;
    }
    @keyframes fade-in {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="p-6">
  <nav class="navbar fixed top-0 left-0 w-full p-4 flex justify-between items-center z-10">
    <div class="flex items-center">
      <img src="logo.png" alt="Logo de Die Deutscshe Hause" class="h-12 rounded-full glow" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
      <h1 class="text-2xl font-bold ml-4">Die Deutscshe Hause</h1>
    </div>
    <div>
      <img src="logo2.png" alt="Logo pequeño" class="h-16 animate-bounce-in" onerror="this.src='https://via.placeholder.com/40?text=Logo2'">
    </div>
  </nav>
  <div class="container mx-auto max-w-4xl mt-24">
    <h1 class="text-4xl font-bold text-center mb-8 animate-bounce-in">Registrar Jugador 👤</h1>
    <div class="card p-6 rounded-3xl glow animate-bounce-in">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-medium">👨‍💼 Nombre</label>
          <input id="firstName" type="text" class="w-full p-3 mt-1 bg-gray-700 rounded-2xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all focus-glow" placeholder="Ingresa el nombre">
        </div>
        <div>
          <label for="lastName" class="block text-sm font-medium">👨‍💼 Apellido</label>
          <input id="lastName" type="text" class="w-full p-3 mt-1 bg-gray-700 rounded-2xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all focus-glow" placeholder="Ingresa el apellido">
        </div>
      </div>
      <div class="flex gap-4 mt-4">
        <button onclick="registerUser()" class="flex-1 bg-blue-400 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-2xl hover-scale">💾 Registrar</button>
        <button onclick="clearForm()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-2xl hover-scale">🗑️ Limpiar</button>
      </div>
      <div id="confirmationMessage" class="mt-4 text-center text-green-400 hidden"></div>
    </div>
    <div class="mt-6 text-center">
      <a href="index.html" class="inline-block bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-2xl hover-scale">🏠 Volver al Menú</a>
    </div>
  </div>
  <script>
    let users = JSON.parse(localStorage.getItem('users')) || [];
    let isAdminLoggedIn = localStorage.getItem('isAdminLoggedIn') === 'true';

    function checkAdminLogin() {
      if (!isAdminLoggedIn) {
        alert('Debes iniciar sesión como administrador para registrar un usuario.');
        window.location.href = 'login.html';
      }
    }

    function registerUser() {
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;

      if (!firstName || !lastName) {
        alert('Por favor, completa todos los campos.');
        return;
      }

      users.push({ firstName, lastName });
      localStorage.setItem('users', JSON.stringify(users));

      const confirmationMessage = document.getElementById('confirmationMessage');
      confirmationMessage.textContent = '✅ Jugador registrado con éxito!';
      confirmationMessage.classList.remove('hidden');
      confirmationMessage.classList.add('confirmation-message');

      setTimeout(() => {
        confirmationMessage.classList.add('hidden');
      }, 3000);

      clearForm();
    }

    function clearForm() {
      document.getElementById('firstName').value = '';
      document.getElementById('lastName').value = '';
      document.getElementById('confirmationMessage').classList.add('hidden');
    }

    window.onload = checkAdminLogin;
  </script>
</body>
</html>
