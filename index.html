<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Die Deutscshe Hause - Menú Principal 🏠</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Arial:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('fondo.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      color: white;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }
    .animate-bounce-in {
      animation: bounce-in 1s ease;
    }
    @keyframes bounce-in {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    .hover-scale {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-scale:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.7);
    }
    .glow {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
    .navbar {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
    }
    .card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body class="p-6">
  <nav class="navbar fixed top-0 left-0 w-full p-4 flex justify-between items-center z-10">
    <div class="flex items-center">
      <img src="logo.png" alt="Logo de Die Deutscshe Hause" class="h-12 rounded-full glow" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
      <h1 class="text-2xl font-bold ml-4">Die Deutscshe Hause 🎮</h1>
    </div>
    <div>
      <img src="logo2.png" alt="Logo pequeño" class="h-16 animate-bounce-in" onerror="this.src='https://via.placeholder.com/40?text=Logo2'">
    </div>
  </nav>
  <div class="container mx-auto max-w-4xl mt-24">
    <h1 class="text-4xl font-bold text-center mb-8 animate-bounce-in">Menú Principal 🏠</h1>
    <div class="card p-6 rounded-3xl glow animate-bounce-in">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <a href="register_user.html" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-2xl text-center hover-scale">👤 Registrar Jugador</a>
        <a href="register_activity.html" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl text-center hover-scale">📋 Registrar Actividad</a>
        <a href="consult_activities.html" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-6 rounded-2xl text-center hover-scale">📊 Consultar Actividades</a>
        <a href="#" onclick="logout()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-6 rounded-2xl text-center hover-scale">🚪 Cerrar Sesión</a>
      </div>
    </div>
  </div>
  <script>
    function checkLogin() {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      if (!isLoggedIn) {
        alert('Debes iniciar sesión para acceder al menú principal.');
        window.location.href = 'login.html';
      }
    }

    function logout() {
      if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
        localStorage.setItem('isLoggedIn', 'false');
        localStorage.setItem('isAdminLoggedIn', 'false');
        alert('Sesión cerrada con éxito.');
        window.location.href = 'login.html';
      }
    }

    window.onload = checkLogin;
  </script>
</body>
</html>
